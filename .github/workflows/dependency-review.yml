name: Dependency Security

# Blocks a pull request that introduces a dependency with a known high or
# critical vulnerability. This is the gate that makes Renovate automerge safe:
# a dependency update cannot merge itself past a known advisory.

# No paths-ignore. A skipped check is not a passing check: the merge gate reads
# SKIPPED as non-terminal-green, so excluding paths here would block rather than
# speed up a documentation-only pull request. The action is inexpensive and
# passes trivially when a diff carries no dependency change.
on:
  pull_request:
    branches: [main]

# Deny all permissions by default — grant per-job
permissions: {}

jobs:
  dependency-review:
    name: Dependency Security Check
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
